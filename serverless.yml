service: team-reveille-student-core

frameworkVersion: "3"

plugins:
  - serverless-dotenv-plugin

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    STUDENT_PROFILES_TABLE: ${self:custom.studentProfilesTableName}
    RESUMES_TABLE: ${self:custom.resumesTableName}
    RESUMES_BUCKET: ${self:custom.resumesBucketName}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, ''}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt StudentProfilesTable.Arn
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt ResumesTable.Arn
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:HeadObject
            - s3:DeleteObject
          Resource:
            - !Sub
                - "arn:aws:s3:::${BucketName}/*"
                - BucketName: !Ref ResumesBucket

custom:
  dotenv:
    exclude:
      - AWS_REGION
  studentProfilesTableName: StudentProfiles-${self:provider.stage}
  resumesTableName: Resumes-${self:provider.stage}
  resumesBucketName: tamu-resumes-${self:provider.stage}-${aws:accountId}
  cors:
    origin: "*"
    headers:
      - Content-Type
      - Authorization

functions:
  # Check if profile exists (first-time sign-in)
  studentProfilesCheckProfileExists:
    handler: src/handlers/studentProfiles.checkProfileExists
    events:
      - http:
          path: api/users/me/profile-exists
          method: get
          cors: ${self:custom.cors}
    # JWT verification performed in handler (Cognito token in Authorization header)

  # Full CRUD for student profiles
  studentProfilesCrud:
    handler: src/handlers/studentProfiles.crud
    events:
      - http:
          path: api/profiles
          method: post
          cors: ${self:custom.cors}
      - http:
          path: api/profiles/me
          method: get
          cors: ${self:custom.cors}
      - http:
          path: api/profiles/me
          method: put
          cors: ${self:custom.cors}
      - http:
          path: api/profiles/me
          method: delete
          cors: ${self:custom.cors}
    # JWT verification performed in handler (Cognito token in Authorization header)

  # Resume upload via S3 presigned URL
  resumesUploadUrl:
    handler: src/handlers/resumes.uploadUrl
    events:
      - http:
          path: api/resumes/upload-url
          method: post
          cors: ${self:custom.cors}

  resumesComplete:
    handler: src/handlers/resumes.complete
    events:
      - http:
          path: api/resumes/complete
          method: post
          cors: ${self:custom.cors}

  resumesList:
    handler: src/handlers/resumes.list
    events:
      - http:
          path: api/resumes/me
          method: get
          cors: ${self:custom.cors}

  resumesDownloadUrl:
    handler: src/handlers/resumes.downloadUrl
    events:
      - http:
          path: api/resumes/{resumeId}/download-url
          method: get
          cors: ${self:custom.cors}

resources:
  Resources:
    StudentProfilesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:custom.studentProfilesTableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        Tags:
          - Key: Project
            Value: TeamReveille
          - Key: Component
            Value: StudentProfiles

    ResumesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:custom.resumesTableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userSub
            AttributeType: S
          - AttributeName: resumeId
            AttributeType: S
        KeySchema:
          - AttributeName: userSub
            KeyType: HASH
          - AttributeName: resumeId
            KeyType: RANGE
        Tags:
          - Key: Project
            Value: TeamReveille
          - Key: Component
            Value: Resumes

    ResumesBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      Properties:
        BucketName: ${self:custom.resumesBucketName}
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - "*"
              AllowedMethods:
                - PUT
                - HEAD
              AllowedOrigins:
                - "*"
              ExposedHeaders:
                - ETag
        Tags:
          - Key: Project
            Value: TeamReveille
          - Key: Component
            Value: Resumes
